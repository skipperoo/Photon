name: Sanitizers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  asan:
    name: ASan ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_ver: 6.10.2
          - os: windows-latest
            qt_ver: 6.10.2
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          modules: "qtshadertools"
          cache: true

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev libvulkan-dev libgl1-mesa-dev \
            libopencv-dev libtiff-dev liblcms2-dev libjpeg-turbo8-dev

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libraw:x64-windows vulkan:x64-windows opencv4:x64-windows tiff:x64-windows libjpeg-turbo:x64-windows lcms:x64-windows

      - name: Configure (ASan)
        shell: bash
        run: |
          cmake -S . -B build_asan -DCMAKE_BUILD_TYPE=Release \
            -DPHOTON_ENABLE_ASAN=ON \
            ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build test targets
        run: cmake --build build_asan --config Release --target tst_RawEngine tst_AppStateManager tst_ImageDecoder -j 4

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
        run: ctest --test-dir build_asan --timeout 180 --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $vsPath = ""
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1)
          }

          $asanDir = ""
          if ($vsPath) {
            $tsRoot = Join-Path $vsPath "VC\Tools\MSVC"
            if (Test-Path $tsRoot) {
              foreach ($ts in (Get-ChildItem $tsRoot -Directory | Sort-Object Name -Descending)) {
                $candidate = Join-Path $ts.FullName "bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll"
                if (Test-Path $candidate) { $asanDir = Split-Path $candidate; break }
              }
            }
            if (-not $asanDir) {
              $candidate = Join-Path $vsPath "VC\Tools\Llvm\x64\bin\clang_rt.asan_dynamic-x86_64.dll"
              if (Test-Path $candidate) { $asanDir = Split-Path $candidate }
            }
          }
          if (-not $asanDir) {
            $candidates = @(
              "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll",
              "C:\Program Files\Microsoft Visual Studio\20*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll"
            )
            foreach ($pattern in $candidates) {
              $found = Get-ChildItem $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $asanDir = $found.DirectoryName; break }
            }
          }
          if (-not $asanDir -and $vsPath -and (Test-Path "$vsPath\VC")) {
            $found = Get-ChildItem -Path "$vsPath\VC" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $asanDir = $found.DirectoryName }
          }

          $exes = @(Get-ChildItem -Path build_asan -Recurse -Filter "tst_*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch [regex]::Escape("\CMakeFiles\") })
          $exeList = ($exes | ForEach-Object { $_.FullName }) -join " | "
          Write-Output "VS install: $vsPath"
          Write-Output "ASan runtime dir: $asanDir"
          Write-Output "Test executables: $exeList"

          if ($exes.Count -eq 0) {
            Write-Output "::error title=No test executables found::searched build_asan recursively"
            exit 1
          }
          if (-not $asanDir) {
            Write-Output "::error title=ASan runtime not found::searched VS install ($vsPath) and Program Files patterns"
            exit 1
          }
          Copy-Item "$asanDir\clang_rt.asan*.dll" -Destination (Split-Path $exes[0].FullName) -Force -ErrorAction SilentlyContinue
          $env:PATH = "$asanDir;$env:PATH"
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:ASAN_OPTIONS = "detect_leaks=0:halt_on_error=1"

          $failed = $false
          foreach ($exe in $exes) {
            $name = $exe.BaseName
            $out = "build_asan\$name.out.txt"
            $err = "build_asan\$name.err.txt"
            $proc = $null
            try {
              $proc = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err -ErrorAction Stop
            } catch {
              Write-Output "::error title=$name failed to start::$($_.Exception.Message)"
              $failed = $true
              continue
            }
            $exited = $proc.WaitForExit(150000)
            if (-not $exited) {
              $proc.Kill()
              $tail = ((Get-Content $err -Tail 30 -ErrorAction SilentlyContinue) + (Get-Content $out -Tail 20 -ErrorAction SilentlyContinue)) -join "`n"
              $tail = $tail -replace "`r", "" -replace "`n", "%0A"
              Write-Output "::error title=$name hung after 150s::$tail"
              $failed = $true
              continue
            }
            Write-Output "$name exit=$($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) {
              $tail = ((Get-Content $err -Tail 40 -ErrorAction SilentlyContinue) + (Get-Content $out -Tail 20 -ErrorAction SilentlyContinue)) -join "`n"
              $tail = $tail -replace "`r", "" -replace "`n", "%0A"
              Write-Output "::error title=$name failed ($($proc.ExitCode))::$tail"
              $failed = $true
            }
          }
          foreach ($f in Get-ChildItem build_asan -Filter "tst_*.err.txt" -ErrorAction SilentlyContinue) {
            Write-Output "----- $($f.Name) (tail) -----"
            Get-Content $f.FullName -Tail 80 | ForEach-Object { Write-Output $_ }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### $($f.Name)`n``````n$(Get-Content $f.FullName -Tail 40 | Out-String)``````n"
          }
          if ($failed) { exit 1 }
