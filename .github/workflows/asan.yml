name: Sanitizers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  asan:
    name: ASan ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_ver: 6.10.2
          - os: windows-latest
            qt_ver: 6.10.2
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          modules: "qtshadertools"
          cache: true

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev libvulkan-dev libgl1-mesa-dev \
            libopencv-dev libtiff-dev liblcms2-dev libjpeg-turbo8-dev

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libraw:x64-windows vulkan:x64-windows opencv4:x64-windows tiff:x64-windows libjpeg-turbo:x64-windows lcms:x64-windows

      - name: Configure (ASan)
        shell: bash
        run: |
          cmake -S . -B build_asan -DCMAKE_BUILD_TYPE=Release \
            -DPHOTON_ENABLE_ASAN=ON \
            ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build test targets
        run: cmake --build build_asan --config Release --target tst_RawEngine tst_AppStateManager tst_ImageDecoder -j 4

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
        run: ctest --test-dir build_asan --timeout 180 --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asanDir = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          Write-Output "::notice title=ASan runtime::$asanDir"
          if ($asanDir) {
            Copy-Item "$asanDir\clang_rt.asan*.dll" "build_asan\tests\Release\" -Force -ErrorAction SilentlyContinue
            $env:PATH = "$asanDir;" + $env:PATH
          }
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;" + $env:PATH
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:ASAN_OPTIONS = "detect_leaks=0:halt_on_error=1"

          $failed = $false
          foreach ($test in @("tst_RawEngine", "tst_AppStateManager", "tst_ImageDecoder")) {
            $exe = "build_asan\tests\Release\$test.exe"
            $out = "build_asan\$test.out.txt"
            $err = "build_asan\$test.err.txt"
            $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            $exited = $proc.WaitForExit(150000)
            if (-not $exited) {
              $proc.Kill()
              $tail = ((Get-Content $err -Tail 30) + (Get-Content $out -Tail 20)) -join "`n"
              $tail = $tail -replace "`r", "" -replace "`n", "%0A"
              Write-Output "::error title=$test hung after 150s::$tail"
              $failed = $true
              continue
            }
            Write-Output "$test exit=$($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) {
              $tail = ((Get-Content $err -Tail 40) + (Get-Content $out -Tail 20)) -join "`n"
              $tail = $tail -replace "`r", "" -replace "`n", "%0A"
              Write-Output "::error title=$test failed ($($proc.ExitCode))::$tail"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
