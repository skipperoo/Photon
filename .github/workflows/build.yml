name: Build and Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A cold vcpkg cache (Windows) rebuilds OpenCV, FFmpeg & co. from source.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        include:
          - os: ubuntu-22.04
            qt_ver: 6.10.2
          - os: windows-latest
            qt_ver: 6.10.2
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          modules: "qtshadertools qtwebsockets"
          cache: true

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          # Hashes the workflow file itself. If you change the install step below, the cache resets automatically.
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev libvulkan-dev libfuse2 libgl1-mesa-dev \
            libxcb-cursor0 libxcb-xinerama0 libxcb-xinput0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon-x11-0 \
            libwayland-dev wayland-protocols libwayland-server0 libopencv-dev \
            imagemagick libtiff-dev liblcms2-dev libjpeg-turbo8-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libssl-dev
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libraw:x64-windows vulkan:x64-windows opencv4:x64-windows tiff:x64-windows libjpeg-turbo:x64-windows lcms:x64-windows "ffmpeg[core,avcodec,avformat,swscale,gpl,x264]:x64-windows" openssl:x64-windows

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build_dir
          cd build_dir
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build
        run: |
          # Bounded parallelism: an unbounded -j runs the runner out of
          # memory on ncnn's ~1000 sources.
          cmake --build build_dir --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtDir = $env:QT_ROOT_DIR
          $env:PATH = "$qtDir\bin;C:\vcpkg\installed\x64-windows\bin;" + $env:PATH

          # Install to a staging directory first
          cmake --install build_dir --config Release --prefix install

          # Run windeployqt to gather Qt dependencies
          Set-Location install\bin
          & "$qtDir\bin\windeployqt.exe" --release --qmldir "${{ github.workspace }}\content" --no-compiler-runtime Photon.exe

          # Go back and create the package from the staging directory
          Set-Location ..\..
          cpack -G WIX -C Release -V --config build_dir/CPackConfig.cmake
          if ($LASTEXITCODE -ne 0) {
            $wixLog = "_CPack_Packages\win64\WIX\wix.log"
            if (Test-Path $wixLog) {
              Write-Host "----- wix.log -----"
              Get-Content $wixLog -Tail 200
              Write-Host "-------------------"
            }
            exit $LASTEXITCODE
          }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # Find qmake dynamically
          export QMAKE=$(find ${{ github.workspace }}/../Qt -name qmake | head -n 1)
          # Pass version to linuxdeploy for better naming
          export VERSION=$(git describe --tags --always)
          # Tell the Qt plugin where to find QML files to scan for dependencies
          export QML_SOURCES_PATHS="${{ github.workspace }}/content"
          # Explicitly request extra platform plugins for better compatibility
          export EXTRA_QT_PLUGINS="platforms,wayland-graphics-integration-client,wayland-shell-integration,imageformats,styles,controls,quickcontrols2,tls"

          # AI denoise model (staged by cmake/AiDenoiseModel.cmake): the app
          # looks for it in <executable dir>/models; linuxdeploy only copies
          # the executable.
          test -f build_dir/models/rawnind_bayer.ncnn.param
          test -f build_dir/models/rawnind_linear.ncnn.param
          mkdir -p AppDir/usr/bin/models
          cp build_dir/models/* AppDir/usr/bin/models/

          # libcrypto also comes from the host: Qt's TLS backend loads the host's
          # libssl, which needs its own matching libcrypto (remote mode).
          # Run linuxdeploy. The Vulkan loader must come from the host (it has
          # to match the installed GPU drivers; an old bundled loader crashed
          # AI denoise GPU initialisation).
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build_dir/Photon -d Photon.desktop -i assets/icons/photon.png \
            --exclude-library "libvulkan.so*" --exclude-library "libcrypto.so*" --plugin qt --output appimage

          # Find the generated AppImage and ensure it's named Photon-x86_64.AppImage
          GENERATED_APPIMAGE=$(ls Photon-*.AppImage | grep -v "linuxdeploy" | head -n 1)
          if [ -n "$GENERATED_APPIMAGE" ] && [ "$GENERATED_APPIMAGE" != "Photon-x86_64.AppImage" ]; then
            mv "$GENERATED_APPIMAGE" Photon-x86_64.AppImage
          fi

          # Remove linuxdeploy tools so they don't get uploaded
          rm linuxdeploy*.AppImage

      # For Windows
      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Windows
          path: ${{ github.workspace }}\*.msi

      # For Linux
      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Linux
          path: Photon-x86_64.AppImage

      - name: Upload Symbols (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Windows-Symbols
          path: build_dir/Release/*.pdb

      - name: Upload Symbols (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Linux-Symbols
          path: build_dir/Photon

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Release Notes
        shell: bash
        run: |
          # The tag's section of CHANGELOG.md ("## [vX.Y.Z] ..." up to the
          # next "## ") becomes the release notes.
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## [" tag "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat release-notes.md

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Photon-Windows/*.msi
            artifacts/Photon-Linux/*.AppImage
            artifacts/Photon-Windows-Symbols/*.pdb
            artifacts/Photon-Linux-Symbols/Photon
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
