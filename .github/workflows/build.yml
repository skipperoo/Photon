name: Build and Release

on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        include:
          - os: ubuntu-22.04
            qt_arch: gcc_64
          - os: windows-latest
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.*'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools qtquickcontrols2'

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev libvulkan-dev libfuse2
          # Download linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libraw:x64-windows

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build
        run: |
          cmake --build build --config Release -j2

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd build/Release
          # Gather Qt dependencies
          windeployqt --qmldir ../../content Photon.exe
          # Generate MSI using CPack
          cd ..
          cpack -G WIX -C Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          export QMAKE=$(which qmake)
          # Use linuxdeploy to create AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/Photon -d Photon.desktop -i assets/icons/photon.png --plugin qt --output appimage
          # Rename output for consistent artifact naming
          mv Photon-*.AppImage Photon-x86_64.AppImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Photon-${{ runner.os }}
          path: |
            build/*.msi
            *.AppImage

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Photon-windows-latest/*.msi
            artifacts/Photon-ubuntu-22.04/*.AppImage
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
