name: Build and Release

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        include:
          - os: ubuntu-22.04
            qt_ver: 6.10.1
          - os: windows-latest
            qt_ver: 6.10.1
            qt_arch: win64_msvc2022_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          modules: "qtshadertools"

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev libvulkan-dev libfuse2 libgl1-mesa-dev \
            libxcb-cursor0 libxcb-xinerama0 libxcb-xinput0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon-x11-0 \
            libwayland-dev wayland-protocols libwayland-server0 \
            imagemagick
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libraw:x64-windows vulkan:x64-windows

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build_dir
          cd build_dir
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build
        run: |
          cmake --build build_dir --config Release -j

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtDir = "${{ github.workspace }}\..\Qt\6.10.1\msvc2022_64"
          $env:PATH = "$qtDir\bin;C:\vcpkg\installed\x64-windows\bin;" + $env:PATH

          Set-Location build_dir
          cpack -G WIX -C Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # Find qmake dynamically
          export QMAKE=$(find ${{ github.workspace }}/../Qt -name qmake | head -n 1)
          # Pass version to linuxdeploy for better naming
          export VERSION=$(git describe --tags --always)
          # Tell the Qt plugin where to find QML files to scan for dependencies
          export QML_SOURCES_PATHS="${{ github.workspace }}/content"
          # Explicitly request extra platform plugins for better compatibility
          export EXTRA_QT_PLUGINS="platforms,wayland-graphics-integration-client,wayland-shell-integration,imageformats"

          # Run linuxdeploy
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build_dir/Photon -d Photon.desktop -i assets/icons/photon.png --plugin qt --output appimage

          # Find the generated AppImage and ensure it's named Photon-x86_64.AppImage
          GENERATED_APPIMAGE=$(ls Photon-*.AppImage | grep -v "linuxdeploy" | head -n 1)
          if [ -n "$GENERATED_APPIMAGE" ] && [ "$GENERATED_APPIMAGE" != "Photon-x86_64.AppImage" ]; then
            mv "$GENERATED_APPIMAGE" Photon-x86_64.AppImage
          fi

          # Remove linuxdeploy tools so they don't get uploaded
          rm linuxdeploy*.AppImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Photon-${{ runner.os }}
          path: |
            build_dir/*.msi
            Photon-x86_64.AppImage

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Photon-windows-latest/*.msi
            artifacts/Photon-ubuntu-22.04/*.AppImage
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
